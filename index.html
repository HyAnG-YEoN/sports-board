<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>SPORTS BOARD</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#eef3ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding:24px 16px 60px}.wrap{max-width:720px;margin:auto}h1{margin:0;font-size:27px;letter-spacing:.06em}p{color:#aab9d0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;color:#a9c9ff;background:#1c3554;border-radius:99px;padding:7px 10px}.card{background:#151f31;border:1px solid #29374d;border-radius:17px;padding:17px;margin-top:15px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:650;cursor:pointer;color:#eaf1ff;background:#2b3c55}.filters button.active,.primary{background:#3875ee;color:white}.game{display:block;width:100%;text-align:left;margin-top:9px;background:#18263b;border:1px solid #2d3d55}.game.selected{border-color:#6da0ff;background:#213755}.game small{display:block;color:#9fb1ca;margin-bottom:8px}.game .score{display:flex;justify-content:space-between;align-items:center;gap:8px}.game b{font-size:17px}.game strong{font-size:21px;white-space:nowrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}label{display:block;color:#b5c5da;font-size:13px;margin-bottom:6px}input,select{width:100%;border:1px solid #34455d;border-radius:9px;padding:12px;background:#0d1727;color:#fff;font-size:16px;min-width:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0e1a2b;padding:14px;border-radius:12px}.stat.wide{grid-column:span 2}.stat small{display:block;color:#a9bad1}.stat strong{display:block;font-size:25px;margin:7px 0}.stat span{font-size:12px;color:#b4c6e1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.muted{font-size:12px;line-height:1.6}.empty{color:#b5c5da;padding:20px;text-align:center}.hidden{display:none}.danger{color:#ffc2c2}.headerline{display:flex;align-items:center;justify-content:space-between;gap:8px}h2{font-size:18px;margin:0 0 14px}@media(max-width:400px){.game b{font-size:14px}.game strong{font-size:18px}}
</style></head>
<body><main class="wrap">
<div class="top"><div><h1>SPORTS BOARD</h1><p>경기 결과 · 통계 대시보드</p></div><span class="pill">수동 입력 버전</span></div>
<div class="filters" id="filters"></div>
<section class="card"><div class="headerline"><h2>내 경기 목록</h2><button id="addBtn" class="primary">+ 경기 추가</button></div><div id="games"></div></section>
<section class="card hidden" id="addPanel"><h2>새 경기 등록</h2><div><label for="sport">종목</label><select id="sport"><option>축구</option><option>야구</option><option>농구</option></select></div><div class="row"><div><label for="home">홈팀</label><input id="home" maxlength="40" placeholder="홈팀 이름"></div><div><label for="away">원정팀</label><input id="away" maxlength="40" placeholder="원정팀 이름"></div></div><div class="actions"><button class="primary" id="saveNew">등록하기</button><button id="cancelNew">취소</button></div></section>
<section class="card" id="editor"><h2>선택한 경기</h2><div id="editFields"><div class="row"><div><label for="hs">홈팀 점수</label><input id="hs" type="number" min="0" step="1" inputmode="numeric"></div><div><label for="as">원정팀 점수</label><input id="as" type="number" min="0" step="1" inputmode="numeric"></div></div><div class="row"><div><label for="line">총점 기준선</label><input id="line" type="number" step="0.5" inputmode="decimal"></div><div><label for="handicap">홈팀 점수 보정값</label><input id="handicap" type="number" step="0.5" inputmode="decimal"></div></div><div class="stats" id="stats"></div><div class="actions"><button id="remove">이 경기 삭제</button></div></div><p id="none" class="hidden">경기를 추가해 주세요.</p></section>
<p class="muted">입력한 정보는 이 기기의 브라우저에 저장됩니다. Safari 데이터 삭제·시크릿 브라우징·기기 변경 시 사라질 수 있습니다. 이 버전은 실시간 경기 결과 또는 스포츠토토 공식 결과와 연결되어 있지 않으며, 베팅 판정 기능을 제공하지 않습니다.</p>
</main>
<script>
(()=>{'use strict';
const key='sports-board-v1';const defaults=[{id:1,sport:'축구',home:'홈팀 A',away:'원정팀 B',hs:'2',as:'1',line:'2.5',handicap:'-0.5'},{id:2,sport:'야구',home:'홈팀 C',away:'원정팀 D',hs:'5',as:'3',line:'8.5',handicap:'-1.5'},{id:3,sport:'농구',home:'홈팀 E',away:'원정팀 F',hs:'82',as:'76',line:'155.5',handicap:'-4.5'}];
let games;try{const stored=JSON.parse(localStorage.getItem(key));games=Array.isArray(stored)?stored:defaults}catch{games=defaults}let selected=games[0]?.id??null;let filter='전체';const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(key,JSON.stringify(games))}catch{}};const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const tabs=['전체','축구','야구','농구'];$('filters').innerHTML=tabs.map(t=>`<button data-filter="${t}" class="${filter===t?'active':''}">${t}</button>`).join('');const shown=games.filter(g=>filter==='전체'||g.sport===filter);$('games').innerHTML=shown.length?shown.map(g=>`<button class="game ${g.id===selected?'selected':''}" data-id="${g.id}"><small>${escape(g.sport)} · 직접 입력</small><div class="score"><b>${escape(g.home)}</b><strong>${escape(g.hs)} : ${escape(g.as)}</strong><b>${escape(g.away)}</b></div></button>`).join(''):'<div class="empty">등록된 경기가 없어요.</div>';
const g=games.find(x=>x.id===selected);$('editFields').classList.toggle('hidden',!g);$('none').classList.toggle('hidden',!!g);if(g){for(const k of ['hs','as','line','handicap'])$(k).value=g[k];renderStats(g)}}
function renderStats(g){const vals=['hs','as','line','handicap'].map(k=>String(g[k]).trim());const [h,a,l,hand]=vals.map(Number);if(vals.some(v=>v==='')||![h,a,l,hand].every(Number.isFinite)||h<0||a<0||!Number.isInteger(h)||!Number.isInteger(a)){$('stats').innerHTML='<p class="danger">점수는 0 이상의 정수로 입력해 주세요.</p>';return}const total=h+a;const adjusted=Math.round((h+hand)*100)/100;const comparison=total>l?'기준선 초과':total<l?'기준선 미만':'기준선 동일';const lead=adjusted>a?'보정 후 홈팀 점수 우세':adjusted<a?'보정 후 원정팀 점수 우세':'보정 후 동점';$('stats').innerHTML=`<div class="stat"><small>총 득점</small><strong>${total}</strong><span>${comparison}</span></div><div class="stat"><small>총점 홀짝</small><strong>${total%2?'홀수':'짝수'}</strong><span>${total}점</span></div><div class="stat wide"><small>보정 점수 비교</small><strong>${adjusted} : ${a}</strong><span>${lead}</span></div>`}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;const shown=games.filter(g=>filter==='전체'||g.sport===filter);if(!shown.some(g=>g.id===selected))selected=shown[0]?.id??null;render()});$('games').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){selected=Number(b.dataset.id);render()}});
$('addBtn').onclick=()=>$('addPanel').classList.remove('hidden');$('cancelNew').onclick=()=>$('addPanel').classList.add('hidden');$('saveNew').onclick=()=>{const home=$('home').value.trim(),away=$('away').value.trim();if(!home||!away){alert('팀 이름을 입력해 주세요.');return}const id=Date.now();games.push({id,sport:$('sport').value,home,away,hs:'0',as:'0',line:'0.5',handicap:'0'});selected=id;filter='전체';$('home').value='';$('away').value='';$('addPanel').classList.add('hidden');save();render()};for(const k of ['hs','as','line','handicap'])$(k).addEventListener('input',()=>{const g=games.find(x=>x.id===selected);if(!g)return;g[k]=$(k).value;save();renderStats(g);const item=document.querySelector(`.game[data-id="${selected}"] strong`);if(item)item.textContent=`${g.hs} : ${g.as}`});$('remove').onclick=()=>{if(!confirm('이 경기를 삭제할까요?'))return;games=games.filter(g=>g.id!==selected);selected=games[0]?.id??null;save();render()};render();
})();
</script></body></html>
